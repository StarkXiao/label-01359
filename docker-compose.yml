version: '3.8'

services:
  frontend-mp:
    build:
      context: ./frontend-mp
      dockerfile: Dockerfile
    container_name: flower-shop-mp
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - flower-shop-network

networks:
  flower-shop-network:
    driver: bridge
